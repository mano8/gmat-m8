# Trivy exceptions (plan §8.3). Every HIGH/CRITICAL finding, fixable or not, must be fixed,
# or accepted here in a PR the maintainer approves. Entries expire after at most 90 days
# (scripts/check_trivyignore.py); an expired entry makes CI fail again.
#
# Format (checked by scripts/check_trivyignore.py, enforced by Trivy via --ignorefile):
#
# vulnerabilities:
#   - id: CVE-2026-00000
#     paths:                      # optional: limit the exception to these files
#       - "usr/local/lib/python3.14/site-packages/example-1.0.dist-info/METADATA"
#     statement: >-               # why, which component, compensating control, owner (name)
#       Why the finding is accepted, the affected component, the control that
#       limits the exposure, and who owns the follow-up (name).
#     expired_at: 2026-12-31      # required; in the future and at most 90 days away
#
# Other sections: misconfigurations, secrets, licenses (same fields).
#
# Added in M1.4 (2026-10-28) for the Debian 13 base image of the application image. Debian's
# tracker lists these as "affected" or "fix_deferred" with no fixed version, so
# `apt-get upgrade` cannot clear them and the python:3.14-slim digest has no newer base to
# move to. Re-evaluate every entry when it expires or when Debian ships a fix, whichever
# comes first, and drop the entry then.

vulnerabilities:
  - id: CVE-2026-76642
    statement: >-
      util-linux (bsdutils, libblkid1, libmount1, libsmartcols1, libuuid1,
      liblastlog2-2, login, mount, util-linux) in the Debian 13 base image of the
      application image has no fixed version yet (Debian tracker status 'affected'
      on 2026-10-28). Affects mount(8) X-mount post-hooks after a failed helper,
      which is not reachable from the service. The application image runs as uid
      1000 with every capability dropped, no-new-privileges and a read-only root
      filesystem, and the service never calls the affected tool. Compensating
      control: those container limits, plus the entry's expiry, which forces a re-review. Owner: maintainer (mano8).
    expired_at: 2027-01-20
