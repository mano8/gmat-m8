  - id: CVE-2026-116587
    statement: >-
      The go-jose v3 copy inside the Caddy 2.11.9 binary has no fixed version yet (Trivy status
      'affected' on 2026-11-06; 2.11.9 moved the v4 copy to the fixed 4.1.6). A denial of service on
      parsing crafted JOSE objects, which Caddy handles only in its ACME conversation with the
      certificate authority it was configured for, never from a client of the site. Caddy is limited
      to 128 MiB and restarts by itself. Compensating control: those limits, plus the entry's expiry,
      which forces a re-review. Owner: maintainer (mano8).
    expired_at: 2027-01-20
  - id: CVE-2026-78661
    statement: >-
      The x/net/html copy inside the Caddy 2.11.9 binary. x/net 0.62.0 fixes it and Caddy's master
      has it, but no released image does yet (2.11.9 of 2026-11-05 is the newest, checked on
      2026-11-07). A denial of service on parsing crafted HTML. Caddy does not import the package
      itself: `go mod why` reaches it only through smallstep's command-line help (caddypki,
      smallstep/certificates, cli-utils/usage). This stack's Caddyfile proxies, serves files and
      compresses, and parses no HTML, so a client of the site has no way to feed it. Caddy is limited
      to 128 MiB and restarts by itself. Compensating control: those limits, plus a short expiry, as
      the fix is to take the first Caddy release that has it. Owner: maintainer (mano8).
    expired_at: 2026-12-07
