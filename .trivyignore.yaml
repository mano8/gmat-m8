    statement: >-
      The Go standard library built into gosu in the official postgres:18-alpine image. The db
      service runs as the postgres user from the start, with no capability, so its entrypoint
      never executes gosu: the file only sits in the image, and govulncheck finds gosu does not
      call the affected Go code anyway. Compensating control: that, plus the entry's expiry,
      which forces a re-review against the next image. Owner: maintainer (mano8).
