version: 2

# Monthly, minor and patch updates grouped. Major updates arrive as separate PRs.
# A base image that moves for the application image (Python) moves for fa-auth-m8 too;
# review them together.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      python:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/docker/app"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      app-image:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    directory: "/docker_compose/gmat_m8"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      stack-images:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/docker/backup"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      backup-image:
        update-types: ["minor", "patch"]
