version: 2

# Monthly, minor and patch updates grouped. Major updates arrive as separate PRs.
# The `docker` (docker/*) and `docker-compose` (docker_compose/gmat_m8) ecosystems are added
# with the files they watch in M1.4 and M1.5; Dependabot reports an error for a directory
# that does not exist.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      python:
        update-types: ["minor", "patch"]
