name: Docker publish

# Publishes BOTH images (application and backup) to GHCR, signed, with a signed
# release-manifest.json (plan §8.4, §9 "Release flow").
#
#   push of a `v*` tag  maintainer only (tag ruleset, CLAUDE.md): verify, scan, push, sign,
#                       attest, create the GitHub Release.
#   workflow_dispatch   build-only: the same verification, builds, scans and SBOMs, but nothing
#                       is pushed, signed or released (`publish` and `release` do not run).
#                       Agents never run it (CLAUDE.md).
#
# Jobs, and why each is where it is:
#   1. verify   the tag is a semantic version with CHANGELOG notes, its commit is an ancestor of
#               origin/main, and ci.yaml, compose-smoke.yaml (and e2e.yaml once it exists) have a
#               successful run on that exact SHA (scripts/verify_release.py).
#   2. scan     per image and architecture (read-only token): build, Trivy gate (HIGH and
#               CRITICAL, no --ignore-unfixed, exceptions only from .trivyignore.yaml), SBOM.
#   3. publish  per image, tag push only, after every scan passed: push the amd64 + arm64 index
#               by digest, gate the PUSHED digest with Trivy again (so what is signed is what
#               was scanned, whatever the build cache did), then cosign keyless signature and a
#               GitHub build-provenance attestation.
#   4. release  release-manifest.json (version, commit, both digests, scan summary, SBOM names),
#               signed with `cosign sign-blob`, then the GitHub Release with notes from
#               CHANGELOG.md, the SBOMs, the Trivy reports and the signed manifest.
# Nothing is signed or released unless every earlier step passed. deploy.sh (M8.4) verifies the
# manifest signature, then each digest, against the identity
#   https://github.com/<owner>/gmat-m8/.github/workflows/docker-publish.yaml@refs/tags/vX.Y.Z
#
# Rules for this file (CLAUDE.md, plan §8.4): no pull_request_target or workflow_run, no
# `on.paths` filter, no secret other than the run's GITHUB_TOKEN, every action pinned by full
# commit SHA, least privilege per job. A change under .github/workflows/ needs the
# maintainer's explicit review.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# A release is never cancelled half-way; a second tag waits for the first.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Same pin and same exception file as ci.yaml (plan §8.3).
  TRIVY_VERSION: "v0.75.0"
  TRIVY_IGNOREFILE: .trivyignore.yaml

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      push: ${{ steps.meta.outputs.push }}
      version: ${{ steps.meta.outputs.version }}
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      # Full history: the ancestry check needs every commit of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: The commit is on main and its required runs are green
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          args=(--sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY")
          if [ "$EVENT_NAME" = "push" ]; then
            args+=(--tag "$REF_NAME")
          fi
          python scripts/verify_release.py "${args[@]}"

      - name: Work out what this run does
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
          # GHCR names are lower case.
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Fail before building anything when the release has no notes.
      - name: CHANGELOG.md has notes for this version
        if: steps.meta.outputs.push == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: python scripts/release_tools.py notes --version "$VERSION"

  # One leg per image and architecture. Read-only: a dispatch runs only verify and this job.
  scan:
    name: scan (${{ matrix.key }}, ${{ matrix.arch }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: app
            name: gmat-m8
            dockerfile: docker/app/Dockerfile
            target: runtime
            arch: amd64
          - key: app
            name: gmat-m8
            dockerfile: docker/app/Dockerfile
            target: runtime
            arch: arm64
          - key: backup
            name: gmat-m8-backup
            dockerfile: docker/backup/Dockerfile
            target: ""
            arch: amd64
          - key: backup
            name: gmat-m8-backup
            dockerfile: docker/backup/Dockerfile
            target: ""
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: matrix.arch == 'arm64'

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # `publish` pushes what this build produced: it reuses these layers through the build
      # cache (one scope per image and architecture) and then scans the pushed digest again.
      - name: Build for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ matrix.name }}:scan
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.key }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.key }}-${{ matrix.arch }}

      # Full report first (every severity, never fails, exceptions not applied), then the gate.
      - name: Trivy report (all severities)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        env:
          TRIVY_IGNOREFILE: ""
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ matrix.name }}:scan
          format: json
          output: trivy-${{ matrix.name }}-${{ matrix.arch }}-report.json
          exit-code: "0"

      - name: Trivy gate (HIGH and CRITICAL, vulnerabilities and secrets)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ matrix.name }}:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ matrix.name }}:scan
          format: spdx-json
          output-file: sbom-${{ matrix.name }}-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload the SBOM and the scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-scan-${{ matrix.key }}-${{ matrix.arch }}
          path: |
            sbom-${{ matrix.name }}-${{ matrix.arch }}.spdx.json
            trivy-${{ matrix.name }}-${{ matrix.arch }}-report.json
          retention-days: 90
          if-no-files-found: ignore

  # Tag push only, and only once every scan leg passed. The whole job is conditional, so no
  # step below needs its own guard.
  publish:
    name: publish (${{ matrix.key }})
    needs: [verify, scan]
    if: needs.verify.outputs.push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signature and the build-provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: app
            name: gmat-m8
            dockerfile: docker/app/Dockerfile
            target: runtime
          - key: backup
            name: gmat-m8-backup
            dockerfile: docker/backup/Dockerfile
            target: ""
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      IMAGE: ${{ needs.verify.outputs.registry }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Needed only if the cache is cold and a layer has to be built again for arm64.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # No BuildKit provenance or SBOM attestations: the signed GitHub attestation and the SBOM
      # files carry them, and the index stays two manifests (amd64, arm64) that deploy.sh pulls
      # by digest.
      - name: Build and push by digest (amd64 + arm64)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.key }}-amd64
            type=gha,scope=${{ matrix.key }}-arm64

      # The scan legs gated the images they built; this gates the digest that is about to be
      # signed. A finding here stops the job before the signature, and nothing trusts an
      # unsigned digest.
      - name: Trivy gate on the pushed digest, amd64
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Trivy gate on the pushed digest, arm64
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The same check deploy.sh makes on the VPS, so a wrong identity fails here and not at
      # the first deploy.
      - name: The signature verifies against this workflow's identity
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DIGEST" > "digest-${NAME}.txt"
          {
            echo "### ${NAME}"
            echo ""
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digest-${{ matrix.key }}
          path: digest-${{ matrix.name }}.txt
          retention-days: 90
          if-no-files-found: error

  release:
    name: release
    needs: [verify, publish]
    if: needs.verify.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach its files
      id-token: write # keyless signature of the manifest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      REGISTRY: ${{ needs.verify.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # release-scan-<key>-<arch> (SBOM, report) and release-digest-<key>.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Write release-manifest.json
        run: |
          set -euo pipefail
          python scripts/release_tools.py manifest \
            --dir release \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --registry "$REGISTRY" \
            --image app=gmat-m8 \
            --image backup=gmat-m8-backup \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output release/release-manifest.json

      - name: Sign release-manifest.json (keyless)
        run: >-
          cosign sign-blob --yes
          --bundle release/release-manifest.json.sigstore.json
          release/release-manifest.json

      - name: The manifest signature verifies against this workflow's identity
        run: >-
          cosign verify-blob
          --bundle release/release-manifest.json.sigstore.json
          --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          release/release-manifest.json

      - name: Release notes from CHANGELOG.md
        run: python scripts/release_tools.py notes --version "$VERSION" --output release-notes.md

      # `--verify-tag` refuses a tag that is not on the remote; an existing release is an error,
      # never overwritten.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "$TAG" --notes-file release-notes.md)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" \
            release/release-manifest.json \
            release/release-manifest.json.sigstore.json \
            release/sbom-*.spdx.json \
            release/trivy-*-report.json
