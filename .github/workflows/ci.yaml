name: CI

# Required checks (set by the maintainer in H1.8): lint, typecheck, security, test,
# trivy-image, secret-scan (and compose-smoke-gate from compose-smoke.yaml).
#
# Rules for this file (CLAUDE.md, plan §8.4): no pull_request_target or workflow_run, no
# `on.paths` filter (a skipped required workflow stays "Pending"), no required job that needs
# a secret on a PR, every action pinned by full commit SHA, least-privilege permissions.
# Only `coverage-upload` reads repository secrets, and it passes without them.
# A change under .github/workflows/ needs the maintainer's explicit review.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Supersede older runs of the same PR; never cancel a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_PYTHON_DOWNLOADS: never
  UV_VERSION: "0.13.5"
  # Pinned so the .trivyignore.yaml format is verified against a known release (plan §8.3).
  TRIVY_VERSION: "v0.75.0"
  TRIVY_IGNOREFILE: .trivyignore.yaml

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lock file is up to date
        run: uv lock --check

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Lint templates
        run: uv run djlint --check templates apps

      - name: Banned constructs and workflow triggers
        run: uv run python scripts/check_access_rules.py

      - name: Security floors (uv.lock)
        run: uv run python scripts/check_security_floors.py

      - name: Trivy exceptions are valid and unexpired
        run: uv run python scripts/check_trivyignore.py

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: mypy
        run: uv run mypy .

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: bandit (no MEDIUM or HIGH findings)
        run: uv run bandit -r apps config scripts --severity-level medium -f json -o bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 90

      - name: pip-audit (locked runtime and dev dependencies)
        run: |
          uv export --frozen --no-emit-project -o audit-requirements.txt
          uv run pip-audit -r audit-requirements.txt --require-hashes --disable-pip --no-deps

      # Full report first (every severity, never fails), then the gate. The gate has no
      # --ignore-unfixed: every HIGH or CRITICAL finding is fixed or accepted in
      # .trivyignore.yaml (plan §8.3).
      - name: Trivy filesystem report (all severities)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        env:
          TRIVY_IGNOREFILE: ""
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs-report.json
          exit-code: "0"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Trivy filesystem gate (HIGH and CRITICAL, vulnerabilities and secrets)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  # Layers A and B (plan §8.1); `live` and `e2e` run in their own workflows. Four jobs at once
  # (issue #42), each on its own runner and database, each leaving its coverage data for
  # `test`. Together they run every test once: `access-integration` and `unit` split the tests
  # that are not `serial` (`unit` ignores exactly what the other runs) and spread them over the
  # runner's cores with pytest-xdist, each worker on its own test database; the `serial` tests
  # depend on wall-clock time and run alone, the volume list test in a job of its own.
  # `--dist load`, never `worksteal`: pytest-django runs the transactional tests last, as their
  # flush empties every table, the rows the migrations seeded included (units of measure).
  # `load` hands each worker its tests in that order; `worksteal` gives the last worker the
  # transactional tail first and then other tests, which find the seeded rows gone.
  test-shard:
    name: test-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: access-integration
            pytest: >-
              -n auto --dist load -m "not live and not e2e and not serial"
              tests/access tests/integration tests/unit/docker
          - shard: unit
            pytest: >-
              -n auto --dist load -m "not live and not e2e and not serial"
              tests --ignore=tests/access --ignore=tests/integration --ignore=tests/unit/docker
          - shard: serial
            pytest: >-
              -m "serial and not live and not e2e"
              tests --ignore=tests/integration/test_list_volume.py
            migrations: true
          - shard: volume
            pytest: >-
              -m "serial and not live and not e2e"
              tests/integration/test_list_volume.py
    services:
      postgres:
        image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_DB: gmat
          POSTGRES_USER: gmat
          # Throwaway credential of a service container that lives for this job only.
          POSTGRES_PASSWORD: gmat_test_pw
        ports:
          - 5432:5432
        # The data lives in memory: a throwaway database of this job only (issue #42).
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U gmat -d gmat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_NAME: gmat
      DB_USER: gmat
      DB_PASSWORD: gmat_test_pw
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      # Nothing here needs to survive a crash: no flush to disk, no full-page images.
      - name: Test database without fsync or synchronous commit
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U gmat -d gmat -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # msgfmt compiles the message catalogs for the i18n tests (the .mo files are not committed).
      # Compiled once here, the tests' own compilemessages finds them up to date, so parallel
      # workers never write the same .mo file.
      - name: Install gettext and compile the catalogs
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
          uv run python manage.py compilemessages --verbosity 0

      - name: No missing migrations
        if: matrix.migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Migrations apply, reverse to zero and apply again
        if: matrix.migrations
        run: uv run python scripts/check_migrations_reversible.py

      # The floor applies in `test`, to the four shards together.
      - name: Tests (${{ matrix.shard }})
        run: uv run pytest ${{ matrix.pytest }} --cov --cov-report= --cov-fail-under=0

      - name: Name the coverage data after the shard
        run: mkdir coverage-data && mv .coverage "coverage-data/${{ matrix.shard }}.coverage"

      - name: Upload the coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.shard }}
          path: coverage-data/${{ matrix.shard }}.coverage
          retention-days: 1
          if-no-files-found: error

  # The required check. It runs whenever the shards ran, and fails unless all four passed:
  # a required check that is skipped counts as passed, so it never depends on `needs` alone.
  test:
    name: test
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "::error::a test shard did not pass (${SHARDS})"
            exit 1
          fi

      # Coverage names each file from the repository's root; the report reads the sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: coverage-data

      - name: Four shards of coverage data
        run: test "$(find coverage-data -name '*.coverage' | wc -l)" = 4

      - name: Coverage of the four shards (project floor 90 %, branch coverage)
        run: |
          uv run coverage combine coverage-data/*.coverage
          uv run coverage json -o coverage.json
          uv run coverage xml -o coverage.xml
          uv run coverage report

      - name: Coverage gate (100 % for apps/access, services, selectors)
        run: uv run python scripts/check_coverage_gates.py coverage.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  # Not a required check. The tokens stay out of `test`, which runs the pull request's code: here
  # nothing of the repository runs, only third-party actions on the report `test` left. A fork's
  # or Dependabot's pull request has no token, nor has a repository that never set one: that
  # service is skipped with a notice and the job passes. Without a green `test`, nothing is sent.
  coverage-upload:
    name: coverage-upload
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Which services have a token
        id: tokens
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          for entry in "codecov CODECOV_TOKEN" "codacy CODACY_PROJECT_TOKEN"; do
            read -r service token <<< "$entry"
            if [ -n "${!token}" ]; then
              echo "${service}=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::No ${token} here (a fork, Dependabot or not set): ${service} is skipped"
            fi
          done

      # Both services match the report's paths against these files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report

      - name: Upload coverage to Codecov
        if: steps.tokens.outputs.codecov == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true

      # Codacy's action fetches its reporter from Codacy's own branch when it runs, whatever this
      # pin says: exception X14 in docs/security.md. It runs last, and has only its own token.
      - name: Upload coverage to Codacy
        if: ${{ !cancelled() && steps.tokens.outputs.codacy == 'true' }}
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  # Builds both releasable images (amd64), proves the app image's run-time posture and holds
  # each to the Trivy gate of plan §8.3: HIGH and CRITICAL, no --ignore-unfixed, exceptions
  # only from .trivyignore.yaml.
  trivy-image:
    name: trivy-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the application image (runtime target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: gmat-m8:ci-scan
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Build the backup image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backup/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: gmat-m8-backup:ci-scan
          build-args: |
            VCS_REF=${{ github.sha }}

      # uid 1000, read-only root filesystem, no capabilities, and `check --deploy` with
      # production settings and throwaway values (nothing here is a secret).
      - name: App image runs as uid 1000 on a read-only root filesystem
        run: |
          set -euo pipefail
          run=(docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges)
          test "$("${run[@]}" --entrypoint id gmat-m8:ci-scan -u)" = "1000"
          if "${run[@]}" --entrypoint touch gmat-m8:ci-scan /app/not-writable 2>/dev/null; then
            echo "the root filesystem is writable" >&2
            exit 1
          fi
          "${run[@]}" \
            -e DJANGO_SECRET_KEY="$(openssl rand -base64 60 | tr -d '\n=+/')" \
            -e MFA_ENCRYPTION_KEYS="$(openssl rand -base64 32 | tr '+/' '-_')" \
            -e OUTBOX_ENCRYPTION_KEYS="$(openssl rand -base64 32 | tr '+/' '-_')" \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost:8443 \
            -e DB_NAME=gmat -e DB_USER=gmat -e DB_PASSWORD=unused-in-check -e DB_HOST=db \
            gmat-m8:ci-scan check

      - name: Backup image runs as uid 1000 and has no unused privilege helper
        run: |
          set -euo pipefail
          run=(docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges)
          test "$("${run[@]}" --entrypoint id gmat-m8-backup:ci-scan -u)" = "1000"
          if "${run[@]}" --entrypoint sh gmat-m8-backup:ci-scan -c 'test -e /usr/local/bin/gosu'; then
            echo "gosu must not be present" >&2
            exit 1
          fi

      # Full report first (every severity, never fails), then the gate.
      - name: Trivy report, application image (all severities)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        env:
          TRIVY_IGNOREFILE: ""
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: gmat-m8:ci-scan
          format: json
          output: trivy-gmat-m8-report.json
          exit-code: "0"

      - name: Trivy report, backup image (all severities)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        env:
          TRIVY_IGNOREFILE: ""
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: gmat-m8-backup:ci-scan
          format: json
          output: trivy-gmat-m8-backup-report.json
          exit-code: "0"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-reports
          path: trivy-*-report.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Trivy gate, application image (HIGH and CRITICAL, vulnerabilities and secrets)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: gmat-m8:ci-scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

      - name: Trivy gate, backup image (HIGH and CRITICAL, vulnerabilities and secrets)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: gmat-m8-backup:ci-scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  # Not a required check: proves both images also build for arm64 (published multi-arch in
  # M1.7). Runs under emulation, so it is slow and kept out of the gate.
  images-arm64:
    name: images-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the application image for arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/app/Dockerfile
          target: runtime
          platforms: linux/arm64
          push: false

      - name: Build the backup image for arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backup/Dockerfile
          platforms: linux/arm64
          push: false

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # GITHUB_TOKEN is the per-run token, not a repository secret; it is read-only on
      # fork PRs and the scan still runs. No GITLEAKS_LICENSE: not needed for a personal
      # account's repository.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
