{% comment %}Decorative 24px outline icon: `name` is home, folder, people, shield, logout, check, alert, box, truck or clipboard.{% endcomment %}
<svg xmlns="http://www.w3.org/2000/svg"
     class="size-6 shrink-0"
     fill="none"
     viewBox="0 0 24 24"
     stroke="currentColor"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true"
     focusable="false">
  {% if name == "home" %}
    <path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10" />
  {% elif name == "folder" %}
    <path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5v-11Z" />
  {% elif name == "people" %}
    <path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm-6 9c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14.5c1.9.8 3 2.9 3 5.5" />
  {% elif name == "shield" %}
    <path d="M12 3 5 6v5.5c0 4.2 2.9 7.6 7 9.5 4.1-1.9 7-5.3 7-9.5V6l-7-3Z" />
    <path d="m9 12 2 2 4-4" />
  {% elif name == "logout" %}
    <path d="M15 4h3.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H15M10 8l-4 4 4 4M6 12h10" />
  {% elif name == "check" %}
    <path d="m5 12.5 4.5 4.5L19 7.5" />
  {% elif name == "alert" %}
    <path d="M12 4 3 19.5h18L12 4Zm0 6v4.5m0 2.5v.01" />
  {% elif name == "box" %}
    <path d="m12 3 8.5 4.5v9L12 21l-8.5-4.5v-9L12 3Zm0 9 8.5-4.5M12 12v9M12 12 3.5 7.5" />
  {% elif name == "clipboard" %}
    <path d="M9 4.5h6M9.5 3h5A1.5 1.5 0 0 1 16 4.5V6H8V4.5A1.5 1.5 0 0 1 9.5 3ZM8 5H6.5A1.5 1.5 0 0 0 5 6.5v13A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-13A1.5 1.5 0 0 0 17.5 5H16M9 11h6M9 15h6" />
  {% elif name == "truck" %}
    <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H14v11H3V6.5ZM14 9h4l3 3.5V16h-7V9Zm-8.5 9.5a1.75 1.75 0 1 0 0-3.5 1.75 1.75 0 0 0 0 3.5Zm11 0a1.75 1.75 0 1 0 0-3.5 1.75 1.75 0 0 0 0 3.5Z" />
  {% endif %}
</svg>
