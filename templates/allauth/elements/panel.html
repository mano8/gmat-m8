{% load allauth %}
<section class="card my-3">
  <h2 class="card-title">
    {% slot title %}
  {% endslot %}
</h2>
{% slot body %}
{% endslot %}
{% if slots.actions %}
  <ul class="mt-3 flex flex-wrap gap-3">
    {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
  </ul>
{% endif %}
</section>
