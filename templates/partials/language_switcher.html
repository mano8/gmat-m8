{% load i18n %}
{% get_available_languages as LANGUAGES %}
<form action="{% url 'set_language' %}"
      method="post"
      class="flex items-center gap-2">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ language_next|default:'/' }}">
  <label for="language" class="sr-only">{% translate "Language" %}</label>
  <select id="language"
          name="language"
          data-autosubmit
          class="min-h-11 rounded-lg border border-line bg-raised px-2 text-base text-ink">
    {% for code, name in LANGUAGES %}
      <option value="{{ code }}"
              lang="{{ code }}"
              {% if code == LANGUAGE_CODE %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <noscript>
    <button type="submit" class="btn">{% translate "Change" %}</button>
  </noscript>
</form>
