# Production overlay (human, on the VPS): a real domain with ACME, ports 80 and 443 only, and
# both images pulled BY DIGEST from GHCR (never built here). The digests come from the signed
# release manifest that `deploy.sh` verifies before it writes them to .env.
#
#   ./deploy.sh X.Y.Z       # the supported way to run it (plan §9)
#
# Needs in .env: APP_DOMAIN (a public name), ACME_EMAIL, APP_DIGEST, BACKUP_DIGEST, and app.env
# copied from app.env.production.example. The admin is off unless DJANGO_ADMIN_ENABLED turns it
# on; then ADMIN_ALLOWED_CIDRS names who may reach it (deploy.sh refuses an empty or open list,
# and an empty one lets nobody in here: the base file's open default never reaches production).

services:
  caddy:
    # Caddy, uid 1000 with no capability, listens on 8080 and 8443 (ADR-0034 point 10). The host
    # publishes them on 80 and 443, or on the unprivileged ports a rootless host redirects 80 and
    # 443 to (.env's PUBLISHED_HTTP_PORT and PUBLISHED_HTTPS_PORT, ADR-0033 point 3). Either way
    # visitors, links and Alt-Svc keep 80 and 443, and ACME's challenges arrive on 80 and 443.
    ports: !override
      - "${PUBLISHED_HTTP_PORT:-80}:8080"
      - "${PUBLISHED_HTTPS_PORT:-443}:8443/tcp"
      - "${PUBLISHED_HTTPS_PORT:-443}:8443/udp"
    environment:
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      HTTPS_PORT_SUFFIX: ""
      # Caddy names the port it listens on in Alt-Svc; the Caddyfile replaces it (measured).
      ALT_SVC_PORT: "443"
      HTTP_PROTOCOLS: "h1 h2 h3"
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:-}
    mem_limit: 128m

  migrate:
    image: ghcr.io/mano8/gmat-m8@${APP_DIGEST:?set APP_DIGEST in .env}
    pull_policy: missing

  web:
    image: ghcr.io/mano8/gmat-m8@${APP_DIGEST:?set APP_DIGEST in .env}
    build: !reset null
    pull_policy: missing
    mem_limit: 2048m  # a burst of 12 sign-ins at once (Argon2): see docker-compose.yml

  decoder:
    image: ghcr.io/mano8/gmat-m8@${APP_DIGEST:?set APP_DIGEST in .env}
    pull_policy: missing

  db:
    ports: !reset []
    mem_limit: 768m

  worker:
    image: ghcr.io/mano8/gmat-m8@${APP_DIGEST:?set APP_DIGEST in .env}
    pull_policy: missing
    mem_limit: 256m

  backup:
    image: ghcr.io/mano8/gmat-m8-backup@${BACKUP_DIGEST:?set BACKUP_DIGEST in .env}
    build: !reset null
    pull_policy: missing
    mem_limit: 384m
