# The malware scanner (M8.3, ADR-0015). No network: `web` reaches it through this socket, on a
# volume only the two of them mount. The signatures are the volume freshclam keeps current.
Foreground yes
LogTime yes
LocalSocket /run/gmat/clamd/clamd.sock
LocalSocketMode 666
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
# At most two uploads are in progress at a time (ATTACHMENT_MAX_PROCESSING).
MaxThreads 2
# Above an attachment's 10 MiB, so nothing the application admits is cut short.
StreamMaxLength 16M
MaxFileSize 16M
MaxScanSize 64M
# What cannot be scanned is refused, never let through: past the limits, or a document with a
# password (a PDF with only an owner password opens without one, and is scanned).
AlertExceedsMax yes
AlertEncryptedDoc yes
# Reload signatures in place: the default keeps two copies in memory while it reloads, which a
# 4 GB server cannot spare. A scan during those seconds waits, or is refused and tried again.
ConcurrentDatabaseReload no
SelfCheck 3600
