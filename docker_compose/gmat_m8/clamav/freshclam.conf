# Keeps the signature volume current (M8.3, ADR-0015). The only part of the scanner with a way
# out; it never sees an uploaded file.
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
# Loading a whole set to test it takes about 1 GB. The sets are signed, and a set clamd cannot
# load leaves it on the one it has.
TestDatabases no
