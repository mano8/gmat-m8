# gmat-m8: the full stack with safe defaults (localhost, Caddy's internal CA, local build).
#
#   bash init.sh                                  # env files with generated secrets
#   docker compose up -d --build --wait           # https://localhost:8443
#
# Overlays: docker-compose.dev.yml (development), docker-compose.production.yml (VPS, images
# by digest), docker-compose.restore-drill.yml (offline restore drill), and
# docker-compose.local-mail.yml (Mailpit, which .env's COMPOSE_FILE adds to a local or CI
# stack started without -f). See README.md.
#
# Networks (plan §7.2, F64, F74): one internal network per database client, so web, worker,
# backup and migrate never share a network and cannot reach each other; `edge` holds only
# Caddy and web; only Caddy publishes ports, through `ingress`. The worker and the backup
# reach the outside through `egress` (SMTP, offsite storage); web has no way out. The two services
# that parse uploaded files, clamd and the decoder, have no network at all: web reaches each
# through a unix socket on a volume only the two of them mount (M8.3, ADR-0015).
name: gmat-m8

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

x-clamav: &clamav
  <<: *hardened
  # x86-64 only: the Debian variant is multi-arch, but ships libxml2 flaws clamd can reach.
  image: clamav/clamav:1.5.4@sha256:6d87c712e3391e13c1ba6e05dfb074d4b1ddb5a6834b23bb9da990d2a4ef042a
  # The image's own `clamav` user, which owns its signature files.
  user: "100:101"
  tmpfs: ["/tmp:uid=100,gid=101,mode=0700,size=128m"]

x-app: &app
  <<: *hardened
  image: ${APP_IMAGE:-gmat-m8:local}
  env_file: app.env
  user: "1000:1000"
  tmpfs: [/tmp]
  pids_limit: 256

services:
  caddy:
    <<: *hardened
    image: caddy:2.11.8-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    # Root inside the container with every capability dropped except the one needed to bind
    # the published ports: the data and config volumes are root-owned, and a read-only root
    # filesystem plus no other capability leaves nothing to abuse. (uid 1000 would need a
    # volume-ownership init step for no gain.)
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-internal@localhost}
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      HTTPS_PORT_SUFFIX: ":${HTTPS_PORT:-8443}"
      # Just above an attachment's 10 MiB plus its form (ATTACHMENT_MAX_REQUEST_BYTES).
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-11MiB}
      CADDY_READ_BODY_TIMEOUT: ${CADDY_READ_BODY_TIMEOUT:-120s}
      HTTP_PROTOCOLS: ${HTTP_PROTOCOLS:-h1 h2}
      ADMIN_URL_PATH: ${ADMIN_URL_PATH:-admin}
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:-0.0.0.0/0 ::/0}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/maintenance:/srv/maintenance:ro
      - ./flags:/srv/flags:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: [/tmp]
    networks: [ingress, edge]
    depends_on:
      web:
        condition: service_started
    # TCP only: the maintenance gate answers 503 on purpose and must not make Caddy unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $${HTTPS_PORT}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    pids_limit: 128

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-gmat}
      DB_USER: ${GMAT_DB_OWNER_USER:?run init.sh}
      DB_PASSWORD: ${GMAT_DB_OWNER_PASSWORD:?run init.sh}
    networks: [db_migrate]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m

  web:
    <<: *app
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    command: ["web"]
    expose: ["8000"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-gmat}
      DB_USER: ${GMAT_DB_RUNTIME_USER:?run init.sh}
      DB_PASSWORD: ${GMAT_DB_RUNTIME_PASSWORD:?run init.sh}
      # Only Caddy, on the pinned edge subnet, may set forwarded headers.
      FORWARDED_ALLOW_IPS: ${EDGE_SUBNET:-172.30.80.0/24}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # The same prefix Caddy restricts to ADMIN_ALLOWED_CIDRS.
      DJANGO_ADMIN_URL_PATH: ${ADMIN_URL_PATH:-admin}
    # Attachments (M6.4): stored files and uploads in progress; never served from here. The
    # scanner's and the decoder's sockets (read only is enough to connect, and web cannot
    # replace them).
    volumes:
      - media:/srv/media
      - clamd_socket:/run/gmat/clamd:ro
      - decoder_socket:/run/gmat/decoder:ro
    networks: [edge, db_web]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/docker/app/entrypoint.sh", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Gunicorn, with room for Argon2 under a burst of sign-ins (100 MiB per hash).
    mem_limit: 1024m

  # Decodes uploaded images, the riskiest parsing the application does (M8.3, X11): its own uid,
  # no network, no volume but its socket and a scratch tmpfs, and no secret in its environment.
  # Not the `app` anchor: that one carries app.env.
  decoder:
    <<: *hardened
    image: ${APP_IMAGE:-gmat-m8:local}
    user: "1001:1001"
    command: ["decoder"]
    network_mode: none
    environment:
      ATTACHMENT_DECODER_SOCKET: /run/gmat/decoder/decoder.sock
    volumes:
      - decoder_socket:/run/gmat/decoder
    tmpfs: ["/tmp:uid=1001,gid=1001,mode=0700,size=128m"]
    healthcheck:
      test: ["CMD", "/app/docker/app/entrypoint.sh", "decoder-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Two children of 512 MiB address space each (plan §9 sizing), the service and their files.
    mem_limit: 1216m
    pids_limit: 32

  # Scans every upload before it is stored (M8.3, X7): no network, signatures read only.
  clamd:
    <<: *clamav
    entrypoint: ["clamd", "--config-file=/etc/gmat/clamd.conf"]
    volumes:
      - ./clamav/clamd.conf:/etc/gmat/clamd.conf:ro
      - clamav_db:/var/lib/clamav:ro
      - clamd_socket:/run/gmat/clamd
    network_mode: none
    healthcheck:
      test: ["CMD", "clamdscan", "--config-file=/etc/gmat/clamd.conf", "--ping", "3"]
      interval: 30s
      timeout: 15s
      retries: 3
      # Loading the signatures takes about 30 s, longer on a busy host.
      start_period: 180s
    # About 1 GiB with the signatures loaded, plus scratch space.
    mem_limit: 1408m
    pids_limit: 32

  # Keeps the signature volume current; a failed update leaves clamd on the set it has. Never sees
  # an uploaded file. Four checks a day, as the mirror's terms ask.
  freshclam:
    <<: *clamav
    entrypoint:
      - freshclam
      - --foreground
      - --daemon
      - --stdout
      - --checks=4
      - --config-file=/etc/gmat/freshclam.conf
    volumes:
      - ./clamav/freshclam.conf:/etc/gmat/freshclam.conf:ro
      - clamav_db:/var/lib/clamav
    networks: [updates]
    # The image's own check asks for a clamd, which is not in this container.
    healthcheck:
      test: ["CMD", "pidof", "freshclam"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    pids_limit: 32

  # The only process that sends email (plan §5): claims outbox rows, delivers them through
  # SMTP and runs the hourly housekeeping. Idle while flags/worker.paused exists.
  worker:
    <<: *app
    command: ["worker"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-gmat}
      DB_USER: ${GMAT_DB_RUNTIME_USER:?run init.sh}
      DB_PASSWORD: ${GMAT_DB_RUNTIME_PASSWORD:?run init.sh}
      # The SMTP password reaches this container only, never web.
      EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD:-}
      WORKER_FLAGS_DIR: /srv/flags
      WORKER_HEARTBEAT_FILE: /tmp/gmat-worker.heartbeat
    volumes:
      - ./flags:/srv/flags:ro
      # Expired uploads' staging files and the media purge (plan §9).
      - media:/srv/media
    networks: [db_worker, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/docker/app/entrypoint.sh", "worker-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # A message being sent may take its whole deadline (60 s) before the worker stops.
    stop_grace_period: 75s
    mem_limit: 256m

  db:
    <<: *hardened
    image: postgres:18-alpine@sha256:eaef288f54a90a909e49f0121d5d047a5e974e922699de4249625cf7cde34f36
    # The entrypoint starts as root, prepares the data directory and drops to postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
      # No slow-statement log: Django binds parameters on the client, so a logged statement
      # would carry its values (names, addresses, notes) into the db log (M8.3).
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gmat}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run init.sh}
      POSTGRES_INITDB_ARGS: "--auth=scram-sha-256"
      GMAT_DB_OWNER_USER: ${GMAT_DB_OWNER_USER:?run init.sh}
      GMAT_DB_OWNER_PASSWORD: ${GMAT_DB_OWNER_PASSWORD:?run init.sh}
      GMAT_DB_RUNTIME_USER: ${GMAT_DB_RUNTIME_USER:?run init.sh}
      GMAT_DB_RUNTIME_PASSWORD: ${GMAT_DB_RUNTIME_PASSWORD:?run init.sh}
      GMAT_DB_BACKUP_USER: ${GMAT_DB_BACKUP_USER:?run init.sh}
      GMAT_DB_BACKUP_PASSWORD: ${GMAT_DB_BACKUP_PASSWORD:?run init.sh}
    volumes:
      - pg_data:/var/lib/postgresql
      - ../../docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
      - /run/postgresql
    # The database is never published. Every client has its own internal network.
    networks: [db_web, db_worker, db_backup, db_migrate]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s
    mem_limit: 768m
    pids_limit: 256

  backup:
    <<: *hardened
    image: ${BACKUP_IMAGE:-gmat-m8-backup:local}
    build:
      context: ../..
      dockerfile: docker/backup/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    user: "1000:1000"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-gmat}
      PGUSER: ${GMAT_DB_BACKUP_USER:?run init.sh}
      PGPASSWORD: ${GMAT_DB_BACKUP_PASSWORD:?run init.sh}
      APP_VERSION: ${APP_VERSION:-dev}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_REST_USERNAME: ${RESTIC_REST_USERNAME:-}
      RESTIC_REST_PASSWORD: ${RESTIC_REST_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      # The stored attachments the snapshot lists are copied from here (read only).
      MEDIA_DIR: /srv/media/files
    volumes:
      - ./backups:/backups
      - media:/srv/media:ro
    tmpfs:
      - /tmp
      # The base image declares a data volume; a tmpfs keeps Docker from creating an
      # anonymous one on every start.
      - /var/lib/postgresql
      - /scratch:uid=1000,gid=1000,mode=0700,size=${BACKUP_SCRATCH_SIZE:-1g}
    networks: [db_backup, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Alive, and the last successful backup (if any) is younger than 7 hours.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pidof supercronic >/dev/null
          && { [ ! -f /backups/.last-success ] || [ -n "$$(find /backups/.last-success -mmin -420)" ]; }
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 384m
    pids_limit: 128

networks:
  # Shared only by Caddy and web; internal, so web has no route out.
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.80.0/24}
  # Caddy's way to the outside world (published ports, ACME). Nothing else joins it.
  ingress: {}
  db_web:
    internal: true
  db_worker:
    internal: true
  db_backup:
    internal: true
  db_migrate:
    internal: true
  # Outbound SMTP for the worker (M2.5) and offsite storage for the backup.
  egress: {}
  # The signature mirror for freshclam alone: what parses files has no way out.
  updates: {}

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  # Attachments (M6.4): owned by uid 1000, created from the image's /srv/media.
  media:
  # The scanner's signatures, seeded from its image on first use, so it starts without a download.
  clamav_db:
  # One socket each, in memory: gone when the service is, owned by the service's uid.
  clamd_socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=101,mode=0755,size=1m,noexec,nosuid,nodev"
  decoder_socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1001,gid=1001,mode=0755,size=1m,noexec,nosuid,nodev"
