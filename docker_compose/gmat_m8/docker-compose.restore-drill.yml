# Restore drill (human, quarterly, on an isolated machine; plan §9): restored data contains
# personal data, so nothing in this project can reach the outside world.
#
#   ./restore-drill.sh --dump BASE --app-image REF --backup-image REF --operator EMAIL
#
# The script passes the same image digests production runs through APP_IMAGE and BACKUP_IMAGE.
# - its own project name, therefore its own volumes: never touches a production stack;
# - EVERY network is internal, `edge` and `ingress` included, so no restored container has a
#   route out; nothing is published, checks run through `docker compose exec`;
# - OUTBOUND_EMAIL=off: the worker never claims or sends a message (post-restore-reconcile
#   then quarantines the restored outbox).
name: gmat-m8-restore-drill

services:
  caddy:
    ports: !reset []
  web:
    environment:
      OUTBOUND_EMAIL: "off"
  worker:
    environment:
      OUTBOUND_EMAIL: "off"
  db:
    ports: !reset []

networks:
  edge:
    internal: true
  ingress:
    internal: true
  db_web:
    internal: true
  db_worker:
    internal: true
  db_backup:
    internal: true
  db_migrate:
    internal: true
  egress:
    internal: true
